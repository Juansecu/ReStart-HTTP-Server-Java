name: Release Application

on:
  push:
    tags:
      - '*.*.*'

env:
  IMAGE_NAME: ${{ github.repository }}
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: maven
      - name: Build Artifact With Maven
        run: mvn -B -U package -DskipTests
      - name: Release Artifact
        uses: softprops/action-gh-release@v2
        with:
          body: Version ${{ github.ref_name }} of the HTTP Server.
          body_path: ./CHANGELOG.md
          files: |
            target/restart-http-server-*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false

  push-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Get Repository Name
        id: get_repository_name
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ env.IMAGE_NAME }}
      - name: Retrieve Major Version
        uses: winterjung/split@v2
        id: split
        with:
          msg: ${{ github.ref_name }}
          separator: .
      - name: Make mvnw Executable
        run: chmod +x mvnw
      - name: Log In to Registry
        uses: docker/login-action@v3
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.get_repository_name.outputs.lowercase }}:${{ github.ref_name }},${{ env.REGISTRY }}/${{ steps.get_repository_name.outputs.lowercase }}:${{ steps.split.outputs._0 }},${{ env.REGISTRY }}/${{ steps.get_repository_name.outputs.lowercase }}:latest

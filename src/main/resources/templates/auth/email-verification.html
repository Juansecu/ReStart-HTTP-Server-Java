<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="apple-mobile-web-app-title" content="FusionFall: ReStart" />

        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="manifest" href="/site.webmanifest" />
        <link rel="shortcut icon" href="/favicon.ico" />

        <title
            th:text="${#messages.msg('email.verification.page.title') + ' | ' + @environment.getProperty('issuer.name')}"
        ></title>

        <link type="text/css" rel="stylesheet" href="/css/main.css" />
        <link type="text/css" rel="stylesheet" href="/css/alert.css" />
        <link type="text/css" rel="stylesheet" href="/css/verification-tokens.css" />
    </head>

    <body>
        <header>
            <img
                class="logo"
                src="/images/restart-transparent-logo.webp"
                alt="Logo"
            />
        </header>

        <main>
            <section id="alertContainer" class="alert-container">
                <div
                    role="alert"
                    th:if="${isAlreadyUsedToken}"
                    class="alert alert--warning"
                >
                    <section>
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 16 16"
                            class="alert__icon"
                        >
                            <path
                                fill-rule="evenodd"
                                d="M8 14.5a6.5 6.5 0 1 0 0-13a6.5 6.5 0 0 0 0 13ZM8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16Zm1-5a1 1 0 1 1-2 0a1 1 0 0 1 2 0Zm-.25-6.25a.75.75 0 0 0-1.5 0v3.5a.75.75 0 0 0 1.5 0v-3.5Z"
                                clip-rule="evenodd"
                            />
                        </svg>
                    </section>

                    <section>
                        <h2 th:text="#{email.verification.confirmation-alert.warning.account-already-verified.title}"></h2>
                        <span th:text="#{email.verification.confirmation-alert.warning.account-already-verified.message}"></span>
                    </section>
                </div>

                <div
                    role="alert"
                    th:unless="${isAlreadyUsedToken}"
                    th:class="${isSuccessful ? 'alert alert--success' : 'alert alert--error'}"
                >
                    <section>
                        <svg
                            th:if="${isSuccessful}"
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 36 36"
                            class="alert__icon"
                        >
                            <path
                                d="M18 2a16 16 0 1 0 16 16A16 16 0 0 0 18 2Zm0 30a14 14 0 1 1 14-14a14 14 0 0 1-14 14Z"
                                class="clr-i-outline clr-i-outline-path-1"
                            />
                            <path
                                d="M28 12.1a1 1 0 0 0-1.41 0l-11.1 11.05l-6-6A1 1 0 0 0 8 18.53L15.49 26L28 13.52a1 1 0 0 0 0-1.42Z"
                                class="clr-i-outline clr-i-outline-path-2"
                            />
                            <path
                                fill="none"
                                d="M0 0h36v36H0z"
                            />
                        </svg>

                        <svg
                            th:unless="${isSuccessful}"
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 16 16"
                            class="alert__icon"
                        >
                            <path
                                fill-rule="evenodd"
                                d="M8 14.5a6.5 6.5 0 1 0 0-13a6.5 6.5 0 0 0 0 13ZM8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16Zm1-5a1 1 0 1 1-2 0a1 1 0 0 1 2 0Zm-.25-6.25a.75.75 0 0 0-1.5 0v3.5a.75.75 0 0 0 1.5 0v-3.5Z"
                                clip-rule="evenodd"
                            />
                        </svg>
                    </section>

                    <section>
                        <h2
                            th:text="${isSuccessful ? #messages.msg('email.verification.confirmation-alert.success.title') : #messages.msg('email.verification.confirmation-alert.error.title')}"
                        ></h2>

                        <span
                            th:if="${!isSuccessful && hasTokenExpired}"
                            th:text="#{verification-token.expired}"
                        ></span>

                        <span
                            th:if="${!hasTokenExpired}"
                            th:text="${isSuccessful ? #messages.msg('email.verification.confirmation-alert.success.message') : #messages.msg('verification-token.invalid')}"
                        ></span>
                    </section>
                </div>

                <button
                    th:if="${!isSuccessful && hasTokenExpired}"
                    th:text="#{email.verification.confirmation-alert.error.resend}"
                    onclick="resendVerificationEmail()"
                    class="button button--secondary"
                ></button>
            </section>
        </main>

        <script
            th:if="${!isSuccessful && hasTokenExpired}"
            type="application/javascript"
            src="/js/auth/email-verification.js"
        ></script>
    </body>
</html>

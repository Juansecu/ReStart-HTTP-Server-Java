# --- AUTHENTICATION CONFIGURATION ---
authentication.minimum-user-age=13

# --- DATABASE CONFIGURATION ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE_NAME}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${POSTGRES_USER}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- DATABASE MIGRATION CONFIGURATION ---
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations

# --- EMAIL CONFIGURATION ---
mail.from-account-related-email-address=${MAIL_SERVER_FROM_ACCOUNT_RELATED_EMAIL_ADDRESS:${spring.mail.username}}
mail.new-account-email-verification-message.message=Hi {username}. Welcome to ${issuer.name}!\n\n\
  To verify your account, click the following link:\n\n\
  {user_account_verification_link}\n\n\
  This link will expire in {hours_to_expire} hours.\n\n\
  If you didn't create an account, you should get in touch with us immediately at ${issuer.support-address}.
mail.new-account-email-verification-message.subject=Verify Your ${issuer.name} Account
spring.mail.host=${MAIL_SERVER_HOST:smtp.gmail.com}
spring.mail.password=${MAIL_SERVER_PASSWORD}
spring.mail.port=${MAIL_SERVER_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.username=${MAIL_SERVER_USERNAME}

# --- ISSUER CONFIGURATION ---
issuer.account-related.name=${ISSUER_ACCOUNT_RELATED_NAME:${issuer.name}}
issuer.name=${ISSUER_NAME}
issuer.support-address=${ISSUER_SUPPORT_ADDRESS}

# --- JWT CONFIGURATION ---
jwt.secret=${JWT_SECRET}

# --- OPENAPI CONFIGURATION ---
springdoc.api-docs.path=/api/api-docs
springdoc.swagger-ui.path=/api/docs

# --- SERVER CONFIGURATION ---
server.headers.content-security-policy=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'self'; media-src 'self'; frame-src 'self'; frame-ancestors 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; manifest-src 'self'; block-all-mixed-content; upgrade-insecure-requests; report-to default"
server.headers.permissions-policy=accelerometer=(), ambient-light-sensor=(), attribution-reporting=(), autoplay=(), bluetooth=(), browsing-topics=(), camera=(), compute-pressure=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), otp-credentials=(), payment=(), picture-in-picture=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), speaker-selection=(), storage-access=(), usb=(), web-share=(), window-management=(), xr-spatial-tracking=()
server.non-authentication-required-endpoints=${springdoc.api-docs.path},${springdoc.swagger-ui.path},/api/api-docs/**,/api/auth/**,/api/swagger-ui/**,/css/**,/apple-touch-icon.png,/favicon.ico,/favicon.svg,/favicon-96x96.png,/fonts/**,/images/**,/js/**,/site.webmanifest,/verification-tokens/verify,/web-app-manifest-192x192.png,/web-app-manifest-512x512.png
server.port=${PORT:8080}
server.public-address=${PUBLIC_ADDRESS:http://localhost:${server.port}}
spring.application.description=@project.description@
spring.application.name=@project.name@
spring.application.version=@project.version@

# --- VERIFICATION TOKENS CONFIGURATION ---
verification-tokens.salt-key=${VERIFICATION_TOKENS_SALT_KEY}
verification-tokens.security-key=${VERIFICATION_TOKENS_SECURITY_KEY}
